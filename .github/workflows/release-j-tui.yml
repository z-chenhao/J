name: Release J-tui

on:
  push:
    tags:
      - J-tui/v*

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          check-latest: true
          cache: false
      - name: Validate tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#J-tui/v}"
          if [[ -z "$version" || "$version" == "$GITHUB_REF_NAME" ]]; then
            echo "tag must match J-tui/v<version>" >&2
            exit 1
          fi
      - name: Test standalone module
        working-directory: J-tui
        env:
          GOWORK: "off"
        run: go test ./...
      - name: Build release archives
        shell: bash
        run: |
          mkdir -p dist
          for operating_system in darwin linux; do
            for architecture in amd64 arm64; do
              output_dir="dist/j-tui_${operating_system}_${architecture}"
              mkdir -p "$output_dir"
              (
                cd J-tui
                GOWORK=off CGO_ENABLED=0 \
                  GOOS="$operating_system" GOARCH="$architecture" \
                  go build -trimpath -ldflags="-s -w" \
                  -o "../${output_dir}/j-tui" ./cmd/j-tui
              )
              tar -C "$output_dir" -czf "${output_dir}.tar.gz" j-tui
              rm -r "$output_dir"
            done
          done
          (
            cd dist
            sha256sum *.tar.gz > checksums.txt
          )
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#J-tui/v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "J-tui ${version}" \
            --generate-notes
